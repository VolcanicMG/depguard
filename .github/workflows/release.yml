name: release

# Publishes cross-compiled `guard` binaries (+ SHA256SUMS) to a GitHub Release
# whenever a version tag is pushed, e.g.:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the Release and upload assets
      id-token: write      # OIDC token the attestation is signed with
      attestations: write  # publish the build-provenance attestation
    steps:
      # Every action is pinned to a full commit SHA, not a moving tag: a
      # supply-chain guard must not import one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod   # single source of truth (currently 1.26.4)

      # Gate the release on the unit suite — a broken commit never ships.
      - name: Unit tests
        run: go test ./...

      # Pure Go (no cgo) → cross-compile every major target from one runner.
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            out="dist/guard-$1-$2$3"
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "-s -w" -o "$out" .
            echo "built $out"
          }
          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"

      - name: Checksums
        run: (cd dist && sha256sum guard-* > SHA256SUMS && cat SHA256SUMS)

      # Sign the binaries' digests with the workflow's OIDC identity BEFORE they
      # ship, so a downloader can prove a release came from this repo's workflow
      # and not from someone with upload rights: gh attestation verify guard-...
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/guard-*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}   # gh is preinstalled on the runner (no 3rd-party action)
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "depguard $GITHUB_REF_NAME" \
            --generate-notes \
            dist/guard-* dist/SHA256SUMS
